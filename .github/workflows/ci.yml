name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (lint, build, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: estacionamento
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://admin:admin123@localhost:5432/estacionamento?schema=public
      DIRECT_URL: postgresql://admin:admin123@localhost:5432/estacionamento?schema=public
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm run test:e2e -- --runInBand

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://praca-central-api.vercel.app

  # Deploys to Vercel only after both test jobs pass on master.
  # Requires the repository secret VERCEL_TOKEN (Vercel > Account > Tokens).
  # Without the secret the job is skipped and deploys stay manual (`vercel --prod`).
  deploy:
    name: Deploy (${{ matrix.app.name }})
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - { name: api, dir: backend, project: prj_DrcSqODGuD9n0wb1DBqZ1rWJmqIa }
          - { name: web, dir: frontend, project: prj_xazWs2UBJik6t1ritb8JOJ59nDti }
    env:
      VERCEL_ORG_ID: team_CdmDo4gYG6BSrTQjk7cEgeyn
      VERCEL_PROJECT_ID: ${{ matrix.app.project }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: ${{ matrix.app.dir }}
    steps:
      - id: token
        run: echo "present=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present != 'true'
        run: echo "VERCEL_TOKEN not set; skipping deploy (deploy manually with 'vercel --prod')."
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.token.outputs.present == 'true'
        run: npm i -g vercel@latest
      - if: steps.token.outputs.present == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: steps.token.outputs.present == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - if: steps.token.outputs.present == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
